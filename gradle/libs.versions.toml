[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.21"
coreKtx                 = "1.13.1"
lifecycleRuntimeKtx     = "2.8.7"
activityCompose         = "1.9.3"
composeBom              = "2024.12.01"
material3               = "1.3.1"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
gson                    = "2.11.0"
coroutines              = "1.9.0"
viewmodelCompose        = "2.8.7"
cameraX                 = "1.4.1"
mlkitBarcode            = "17.3.0"
accompanistPermissions  = "0.36.0"

[libraries]
androidx-core-ktx              = { group = "androidx.core",              name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose      = { group = "androidx.activity",           name = "activity-compose",               version.ref = "activityCompose" }
androidx-compose-bom           = { group = "androidx.compose",            name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui            = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",   name = "ui-test-junit4" }
androidx-compose-material3     = { group = "androidx.compose.material3",  name = "material3",                      version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",    version.ref = "viewmodelCompose" }
retrofit                       = { group = "com.squareup.retrofit2",      name = "retrofit",                       version.ref = "retrofit" }
retrofit-converter-gson        = { group = "com.squareup.retrofit2",      name = "converter-gson",                 version.ref = "retrofit" }
okhttp                         = { group = "com.squareup.okhttp3",        name = "okhttp",                         version.ref = "okhttp" }
okhttp-logging-interceptor     = { group = "com.squareup.okhttp3",        name = "logging-interceptor",            version.ref = "okhttp" }
gson                           = { group = "com.google.code.gson",        name = "gson",                           version.ref = "gson" }
coroutines-android             = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
camerax-core                   = { group = "androidx.camera",             name = "camera-core",                    version.ref = "cameraX" }
camerax-camera2                = { group = "androidx.camera",             name = "camera-camera2",                 version.ref = "cameraX" }
camerax-lifecycle              = { group = "androidx.camera",             name = "camera-lifecycle",               version.ref = "cameraX" }
camerax-view                   = { group = "androidx.camera",             name = "camera-view",                    version.ref = "cameraX" }
mlkit-barcode-scanning         = { group = "com.google.mlkit",            name = "barcode-scanning",               version.ref = "mlkitBarcode" }
accompanist-permissions        = { group = "com.google.accompanist",      name = "accompanist-permissions",        version.ref = "accompanistPermissions" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
